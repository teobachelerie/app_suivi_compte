<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Finelio — Simulateur PEA</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;background:#000;}
  .fin-root{font-family:"Inter",system-ui,-apple-system,sans-serif;}
  .fin-row{display:flex;align-items:center;}
  .fin-card{background:#121212;border-radius:16px;padding:16px;box-sizing:border-box;}
  .fin-muted{color:#9a938c;}
  .fin-ink{color:#f6f5f2;}
  label span{display:block;margin-bottom:6px;}
  input{background:#1c1613;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:12px 14px;color:#f6f5f2;font-family:inherit;font-size:15px;box-sizing:border-box;width:100%;}
</style>
</helmet>
<div class="fin-root" style="width: 390px; height: 1120px; box-sizing: border-box; background: #000000; color: #f6f5f2; position: relative; overflow: hidden;">
  <div style="position: absolute; inset: 0; z-index: 0; pointer-events: none; background:
    radial-gradient(circle at 12% 6%, rgba(255,128,46,0.16), transparent 42%),
    radial-gradient(circle at 92% 26%, rgba(229,63,26,0.14), transparent 48%),
    radial-gradient(circle at 55% 92%, rgba(99,25,10,0.20), transparent 52%);"></div>

  <div style="position: relative; z-index: 1; padding: 24px 20px 32px 20px; display: flex; flex-direction: column; gap: 18px;">

    <div class="fin-row" style="gap: 14px;">
      <button type="button" aria-label="Retour" style="background: #121212; border: none; border-radius: 999px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f6f5f2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <span class="fin-ink" style="font-size: 18px; font-weight: 700;">Simulateur PEA</span>
    </div>

    <div class="fin-card" style="display: flex; flex-direction: column; gap: 8px;">
      <span class="fin-muted" style="font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;">Valeur estimée après 20 ans</span>
      <span style="color: #ffbb2e; font-size: 30px; font-weight: 700;">118&nbsp;461,00&nbsp;€</span>
      <span class="fin-muted" style="font-size: 13px;">dont 69&nbsp;461,00&nbsp;€ d'intérêts</span>
    </div>

    <div class="fin-card" style="padding: 20px 16px 8px 16px;">
      <svg viewBox="0 0 320 140" width="100%" height="140">
        <defs>
          <linearGradient id="peaFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffbb2e" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#ffbb2e" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <polygon points="0,128 40,124 80,116 120,102 160,82 200,58 240,34 280,16 320,4 320,140 0,140" fill="url(#peaFill)"/>
        <polyline points="0,128 40,124 80,116 120,102 160,82 200,58 240,34 280,16 320,4" fill="none" stroke="#ffbb2e" stroke-width="3" stroke-linejoin="round"/>
        <polyline points="0,128 40,120 80,110 120,98 160,84 200,68 240,50 280,30 320,8" fill="none" stroke="#f6f5f2" stroke-width="2" stroke-opacity="0.6"/>
      </svg>
      <div class="fin-row" style="justify-content: space-between; margin-top: 4px;">
        <span class="fin-muted" style="font-size: 11px;">1 an</span>
        <span class="fin-muted" style="font-size: 11px;">5 ans</span>
        <span class="fin-muted" style="font-size: 11px;">10 ans</span>
        <span class="fin-muted" style="font-size: 11px;">16 ans</span>
        <span class="fin-muted" style="font-size: 11px;">20 ans</span>
      </div>
      <div class="fin-row" style="gap: 16px; justify-content: center; margin-top: 12px;">
        <div class="fin-row" style="gap: 6px;"><span style="width: 10px; height: 10px; border-radius: 50%; background: #f6f5f2; opacity: 0.6; display: inline-block;"></span><span class="fin-muted" style="font-size: 12px;">Versements</span></div>
        <div class="fin-row" style="gap: 6px;"><span style="width: 10px; height: 10px; border-radius: 50%; background: #ffbb2e; display: inline-block;"></span><span class="fin-muted" style="font-size: 12px;">Intérêts</span></div>
      </div>
    </div>

    <span class="fin-muted" style="font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; padding-left: 4px;">Paramètres</span>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <label><span class="fin-muted" style="font-size: 13px;">Apport initial (€)</span><input type="text" value="1000"></label>
      <label><span class="fin-muted" style="font-size: 13px;">Versement mensuel (€)</span><input type="text" value="200"></label>
      <label><span class="fin-muted" style="font-size: 13px;">Rente mensuelle retirée (€, facultatif)</span><input type="text" value="0"></label>
      <label><span class="fin-muted" style="font-size: 13px;">Rendement annuel (%)</span><input type="text" value="8"></label>
      <label><span class="fin-muted" style="font-size: 13px;">Inflation annuelle (%)</span><input type="text" value="3"></label>
      <label><span class="fin-muted" style="font-size: 13px;">Durée (années)</span><input type="text" value="20"></label>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>

</body>
</html>
