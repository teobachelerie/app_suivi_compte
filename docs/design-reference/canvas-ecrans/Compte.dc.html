  .fin-row{display:flex;align-items:center;}
  .fin-btw{display:flex;align-items:center;justify-content:space-between;}
  .fin-card{background:#121212;border-radius:16px;padding:16px;box-sizing:border-box;}
  .fin-muted{color:#9a938c;}
  .fin-ink{color:#f6f5f2;}
  .toggle-on{width:44px;height:26px;border-radius:999px;background:#ff802e;position:relative;}
  .toggle-on i{width:20px;height:20px;border-radius:50%;background:#000;position:absolute;top:3px;right:3px;display:block;}
  .toggle-off{width:44px;height:26px;border-radius:999px;background:rgba(255,255,255,0.12);position:relative;}
  .toggle-off i{width:20px;height:20px;border-radius:50%;background:#f6f5f2;position:absolute;top:3px;left:3px;display:block;}

<div class="fin-root" style="width: 390px; height: 340px; box-sizing: border-box; background: #000000; color: #f6f5f2; position: relative; overflow: hidden;">
  <div style="position: absolute; inset: 0; z-index: 0; pointer-events: none; background:
    radial-gradient(circle at 12% 6%, rgba(255,128,46,0.16), transparent 42%),
    radial-gradient(circle at 92% 26%, rgba(229,63,26,0.14), transparent 48%),
    radial-gradient(circle at 55% 92%, rgba(99,25,10,0.20), transparent 52%);"></div>

  <div style="position: relative; z-index: 1; padding: 24px 20px 32px 20px; display: flex; flex-direction: column; gap: 18px;">

      <button type="button" aria-label="Retour" style="background: #121212; border: none; border-radius: 999px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer;">

    </div>

    <div class="fin-card" style="display: flex; flex-direction: column; gap: 14px;">
      <span class="fin-muted" style="font-size: 14px;">prenom.nom@exemple.com</span>
      <button type="button" style="background: rgba(229,63,26,0.12); color: #e53f1a; border: none; border-radius: 14px; padding: 14px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e53f1a" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>

    <span class="fin-muted" style="font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; padding-left: 4px;">Zone de danger</span>
    <div class="fin-card">
      <span style="color: #e53f1a; font-size: 15px; font-weight: 600;">Supprimer mon compte</span>
    </div>

  </div>
</div>
