<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Finelio — Connexion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;background:#000;}
  .fin-root{font-family:"Inter",system-ui,-apple-system,sans-serif;}
  .fin-muted{color:#9a938c;}
  .fin-ink{color:#f6f5f2;}
  input::placeholder{color:#6b655f;}
</style>
</helmet>
<div class="fin-root" style="width: 390px; height: 780px; box-sizing: border-box; background: #000000; color: #f6f5f2; position: relative; overflow: hidden;">
  <div style="position: absolute; inset: 0; z-index: 0; pointer-events: none; background:
    radial-gradient(circle at 20% 15%, rgba(255,128,46,0.22), transparent 45%),
    radial-gradient(circle at 85% 30%, rgba(229,63,26,0.18), transparent 50%),
    radial-gradient(circle at 50% 100%, rgba(99,25,10,0.25), transparent 55%);"></div>

  <div style="position: relative; z-index: 1; height: 100%; box-sizing: border-box; padding: 0 24px; display: flex; flex-direction: column; justify-content: center; gap: 32px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <span class="fin-ink" style="font-size: 32px; font-weight: 700;">Finelio</span>
      <span class="fin-muted" style="font-size: 14px;">Suivi de dépenses</span>
    </div>

    <div style="background: #121212; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; background: #1c1613; border-radius: 14px; padding: 4px; gap: 4px;">
        <div style="flex: 1; text-align: center; padding: 10px; border-radius: 10px; background: #ff802e; color: #000000; font-size: 14px; font-weight: 700;">Se connecter</div>
        <div style="flex: 1; text-align: center; padding: 10px; border-radius: 10px; color: #9a938c; font-size: 14px; font-weight: 600;">Créer un compte</div>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px;">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Email</span>
        <input type="email" placeholder="Email" style="background: #1c1613; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 14px 16px; color: #f6f5f2; font-family: inherit; font-size: 15px; box-sizing: border-box;">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px;">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Mot de passe</span>
        <input type="password" placeholder="Mot de passe" style="background: #1c1613; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 14px 16px; color: #f6f5f2; font-family: inherit; font-size: 15px; box-sizing: border-box;">
      </label>
      <button type="button" style="background: #ff802e; color: #000000; border: none; border-radius: 14px; padding: 16px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;">Se connecter</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":780}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
